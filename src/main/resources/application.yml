spring:
  profiles:
    active: local

  application:
    name: plannie-backend

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

cors:
  allowed-origins: http://localhost:3000

server:
  port: 8080

# Swagger 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Resilience4j 설정
resilience4j:
  circuitbreaker:
    instances:
      openai:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      openai:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2

---
# Local 환경 (H2, RAG 기능 미포함)
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:plannie;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cache:
    type: simple  # 로컬: 인메모리 캐시 (Redis 불필요). 프로덕션은 redis로 변경

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.plannie: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

openai:
  api-key: ${OPENAI_API_KEY:your-api-key}
  model: gpt-4o

jwt:
  secret: ${JWT_SECRET:plannie-local-dev-secret-key-must-be-at-least-32-chars}
  expiration-ms: 86400000  # 24시간

---
# Local PostgreSQL 환경 (RAG 기능 포함, docker-compose 필요)
spring:
  config:
    activate:
      on-profile: local-pg

  datasource:
    url: jdbc:postgresql://localhost:5432/plannie
    username: plannie
    password: plannie
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__create_rag_tables.sql

  cache:
    type: simple

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.plannie: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

openai:
  api-key: ${OPENAI_API_KEY:your-api-key}
  model: gpt-4o

jwt:
  secret: ${JWT_SECRET:plannie-local-dev-secret-key-must-be-at-least-32-chars}
  expiration-ms: 86400000  # 24시간

---
# Production 환경
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

logging:
  level:
    com.plannie: INFO

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000  # 24시간

springdoc:
  api-docs:
    enabled: false  # prod에서 API 문서 비활성화
  swagger-ui:
    enabled: false
